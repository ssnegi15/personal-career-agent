name: Career Agent - Daily

on:

  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: career-agent
  cancel-in-progress: false

jobs:

  agent:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run career agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONPATH: .
        run: |
          python career-agent/agent/daily.py

      - name: Publish updated state
        run: |
          git config user.name "career-agent"
          git config user.email "career-agent@users.noreply.github.com"

          git add data memory

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore(agent): update career state"
            git push
          fi
