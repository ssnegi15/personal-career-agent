name: OpenClaw Career Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: openclaw-career-agent
  cancel-in-progress: false

jobs:
  career-agent:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install job search dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python
        run: |
          python --version
          pip --version

      # ==================================================
      # NODE / OPENCLAW
      # ==================================================

      - name: Setup Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install OpenClaw
        run: |
          npm install -g openclaw@latest

      - name: Verify OpenClaw
        run: |
          openclaw --version
          openclaw --help

      # ==================================================
      # JOB DISCOVERY
      # ==================================================

      - name: Search jobs
        run: |
          python agent/search_jobs.py

      - name: Verify jobs data
        run: |
          test -f data/jobs.json

          python - <<'PY'
          import json

          path = "data/jobs.json"

          with open(path, encoding="utf-8") as f:
              jobs = json.load(f)

          if not isinstance(jobs, list):
              raise SystemExit(
                  "data/jobs.json must contain a JSON list"
              )

          print(
              f"Jobs available for OpenClaw: {len(jobs)}"
          )

          for job in jobs[:10]:
              print(
                  f"- {job.get('title', 'Unknown')} | "
                  f"{job.get('company', 'Unknown')} | "
                  f"{job.get('location', 'Unknown')} | "
                  f"{job.get('url', '')}"
              )
          PY

      # ==================================================
      # CREATE OPENCLAW TASK
      # ==================================================

      - name: Create agent task
        run: |
          cat > "$RUNNER_TEMP/career-task.md" <<'EOF'

          You are the Personal Career Agent.

          ==================================================
          ROLE
          ==================================================

          You are a personal autonomous career-analysis
          assistant.

          The Python Job Search Agent has already discovered
          public job opportunities.

          Your job is NOT to perform independent job
          discovery.

          Your job is to analyze the jobs already collected.

          ==================================================
          READ THESE FILES
          ==================================================

          Read:

          memory/profile.yaml
          memory/preferences.yaml
          memory/decisions.json
          memory/lessons.json
          memory/conversation.json
          memory/search_history.json
          memory/rejected_jobs.json
          memory/saved_jobs.json

          data/jobs.json

          agent/prompts/system.txt

          ==================================================
          JOB DATA
          ==================================================

          data/jobs.json contains jobs discovered by the
          Python job-search worker.

          Analyze those jobs against the candidate profile.

          Do not assume that every job is suitable.

          ==================================================
          CANDIDATE
          ==================================================

          Target seniority includes:

          - Principal Software Engineer
          - Staff Software Engineer
          - Software Architect
          - Principal Engineer
          - Senior Engineering Manager
          - Associate Director
          - Similar senior technical leadership roles

          Important preferences:

          - Remote India
          - Remote-only preferred
          - Senior technical responsibility
          - Architecture
          - Distributed systems
          - Cloud
          - Backend engineering
          - System design
          - Microservices
          - API design
          - Scalability
          - Technical leadership

          ==================================================
          SECURITY
          ==================================================

          The execution environment is a temporary
          GitHub Actions Linux runner.

          Stay inside the repository workspace.

          Never access:

          - user's Mac
          - Mac filesystem
          - host filesystem outside the repository
          - SSH
          - SSH keys
          - Keychain
          - browser passwords
          - browser credentials
          - Gmail
          - private email
          - private accounts
          - personal accounts

          Never:

          - apply for a job
          - submit an application
          - contact a recruiter
          - send an external message
          - spend money
          - purchase anything
          - create external accounts
          - modify GitHub workflow files

          ==================================================
          AUTONOMY BOUNDARY
          ==================================================

          You may make reasonable internal decisions about:

          - job ranking
          - relevance scoring
          - interview preparation
          - skill-gap identification
          - search-strategy observations
          - learning from existing decisions

          Important external actions require user
          confirmation.

          Do not perform external actions.

          ==================================================
          ANALYSIS
          ==================================================

          For each strong job candidate:

          1. Identify the job.
          2. Provide the direct job URL.
          3. Assess seniority.
          4. Assess remote suitability.
          5. Assess technical alignment.
          6. Assess leadership alignment.
          7. Identify important requirements.
          8. Identify likely skill gaps.
          9. Explain why the candidate should or should
             not consider the role.
          10. Give a practical recommendation.

          ==================================================
          RANKING
          ==================================================

          Prioritize:

          1. Strong profile match.
          2. Principal/Staff/Architect-level scope.
          3. Senior engineering leadership.
          4. Remote India.
          5. Remote-only roles.
          6. Architecture and distributed systems.
          7. Cloud/platform/backend engineering.
          8. System design and scalability.
          9. Technical leadership.

          Do not recommend a job merely because its title
          contains "Engineer".

          ==================================================
          INTERVIEW PREPARATION
          ==================================================

          Generate useful interview preparation based on
          the strongest jobs found.

          Include:

          - system-design questions
          - architecture questions
          - distributed-systems questions
          - scalability questions
          - cloud questions
          - leadership questions
          - behavioral questions
          - role-specific questions

          Provide concise model answers.

          ==================================================
          SKILL GAPS
          ==================================================

          Identify recurring requirements that appear in
          strong jobs but are not clearly represented in
          the candidate profile.

          Separate:

          - critical gaps
          - useful gaps
          - optional skills

          ==================================================
          LEARNING
          ==================================================

          Review:

          memory/decisions.json
          memory/lessons.json
          memory/rejected_jobs.json
          memory/saved_jobs.json

          Look for patterns.

          Examples:

          - roles repeatedly rejected
          - roles repeatedly saved
          - preferred companies
          - unwanted locations
          - unwanted seniority
          - recurring skill requirements

          Update learning files only when there is enough
          evidence to justify the change.

          Do not invent user preferences.

          ==================================================
          REPORT
          ==================================================

          Save the final career briefing to:

          data/latest_report.md

          The report should contain:

          # Daily Career Briefing

          ## Top Opportunities

          Ranked strong matches with:

          - Job title
          - Company
          - Location
          - Remote status
          - Match assessment
          - Relevance score
          - Direct job link
          - Key reasons
          - Main concerns

          ## Other Interesting Jobs

          Jobs worth considering but with weaker matches.

          ## Skill Gaps

          Important skills appearing across relevant jobs.

          ## Interview Questions

          Questions relevant to the strongest opportunities.

          ## Model Answers

          Strong concise answers for those questions.

          ## Search Strategy

          What the current job market appears to be
          emphasizing.

          ## Decisions Needed

          List only decisions that genuinely require
          the user's input.

          ==================================================
          IMPORTANT
          ==================================================

          Never claim that a job was applied to.

          Never claim that a recruiter was contacted.

          Never claim that an external action occurred
          unless it actually occurred.

          Never invent job details.

          If information is missing, say so.

          If there are no suitable jobs, clearly say so.

          EOF

      # ==================================================
      # OPENCLAW
      # ==================================================

      - name: Run OpenClaw
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |
          openclaw agent exec \
            --isolated \
            --auth-env-only \
            --model openrouter/openrouter/free \
            --message-file "$RUNNER_TEMP/career-task.md" \
            --cwd "$GITHUB_WORKSPACE" \
            --timeout 1200 \
            --json \
            > "$RUNNER_TEMP/openclaw-result.json"

      # ==================================================
      # DISPLAY OPENCLAW RESULT
      # ==================================================

      - name: Display OpenClaw result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/openclaw-result.json" ]; then
            cat "$RUNNER_TEMP/openclaw-result.json"
          else
            echo "No OpenClaw result file was produced."
          fi

      # ==================================================
      # VERIFY REPORT
      # ==================================================

      - name: Check generated report
        run: |
          test -f data/latest_report.md

          echo "Career report generated."

          echo "Report preview:"
          echo "----------------------------------------"
          head -100 data/latest_report.md
          echo "----------------------------------------"

      # ==================================================
      # SAVE STATE
      # ==================================================

      - name: Save agent state
        run: |
          git config user.name \
            "personal-career-agent"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data memory

          if git diff --cached --quiet; then
            echo "No agent state changes."
          else
            git commit \
              -m "chore(agent): daily career update"

            git push
          fi
