name: Deploy Career Website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== SITE FILES ====="
          find site -maxdepth 2 -type f -print

          echo "===== SITE INDEX ====="
          head -30 site/index.html

          echo "===== CHECK FOR KIRA ====="
          if grep -qi "About KIRA" site/index.html; then
            echo "ERROR: KIRA content exists in site/index.html"
            exit 1
          else
            echo "OK: KIRA content not found"
          fi

      - name: Prepare website
        run: |
          rm -rf public

          mkdir -p public/data

          cp -R site/. public/

          cp data/jobs.json public/data/jobs.json
          cp data/latest_report.md public/data/latest_report.md

      - name: Verify published index
        run: |
          echo "===== PUBLISHED INDEX ====="
          head -30 public/index.html

          echo "===== PUBLISHED FILES ====="
          find public -maxdepth 3 -type f -print

          echo "===== CHECK PUBLISHED KIRA ====="
          if grep -qi "About KIRA" public/index.html; then
            echo "ERROR: KIRA content found in published index"
            exit 1
          else
            echo "OK: KIRA content not found"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
