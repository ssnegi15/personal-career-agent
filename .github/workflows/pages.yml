name: Deploy Career Website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "data/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website
        run: |

          rm -rf public

          mkdir -p public/data

          cp -r site/* public/

          cp data/jobs.json \
             public/data/jobs.json

          cp data/latest_report.md \
             public/data/latest_report.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
