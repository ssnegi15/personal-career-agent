<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personal Career Agent</title>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel2: #172033;
      --border: #263449;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #60a5fa;
      --blue-dark: #2563eb;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(1250px, 94%);
      margin: auto;
      padding: 32px 0 60px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 23px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    /* ================================
       STATS
       ================================ */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 15px;
      margin-bottom: 30px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    /* ================================
       CONTROLS
       ================================ */

    .controls {
      display: grid;
      grid-template-columns:
        minmax(220px, 2fr)
        minmax(150px, 1fr)
        minmax(150px, 1fr);

      gap: 12px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

      padding: 15px;
      margin-bottom: 22px;
    }

    input,
    select {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--blue-dark);
      border-color: var(--blue);
    }

    /* ================================
       JOB
       ================================ */

    .job {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .job:hover {
      border-color: #3b82f6;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .job-title {
      font-size: 20px;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .company {
      color: var(--muted);
      font-size: 15px;
    }

    .score {
      min-width: 72px;
      text-align: center;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      background: #14532d;
      color: #bbf7d0;
    }

    .score.medium {
      background: #713f12;
      color: #fef08a;
    }

    .score.low {
      background: #450a0a;
      color: #fecaca;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .tag {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.6;
      margin: 12px 0;
    }

    .description-preview {
      color: #cbd5e1;
      line-height: 1.6;
      margin: 12px 0 8px;
    }

    details {
      margin: 10px 0 16px;
    }

    summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 14px;
      user-select: none;
    }

    summary:hover {
      text-decoration: underline;
    }

    .full-description {
      margin-top: 12px;
      color: #cbd5e1;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
      padding: 15px;
      background: var(--panel2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .job-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .job-link {
      display: inline-block;
      background: var(--blue-dark);
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: 600;
    }

    .job-link:hover {
      background: #1d4ed8;
      text-decoration: none;
    }

    .result-count {
      color: var(--muted);
      margin-bottom: 15px;
      font-size: 14px;
    }

    /* ================================
       REPORT
       ================================ */

    .report {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #dbeafe;
      overflow-x: auto;
    }

    /* ================================
       STATES
       ================================ */

    .empty {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 25px;
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: #450a0a;
      border: 1px solid #7f1d1d;
      padding: 15px;
      border-radius: 8px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 40px;
    }

    @media (max-width: 750px) {

      .controls {
        grid-template-columns: 1fr;
      }

      .job-header {
        flex-direction: column;
      }

      .score {
        width: fit-content;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header>
    <h1>Personal Career Agent</h1>

    <p class="subtitle">
      Autonomous job discovery, analysis and interview preparation
    </p>
  </header>


  <!-- ============================================
       STATS
       ============================================ -->

  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="jobCount">-</div>
      <div class="stat-label">Jobs discovered</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="remoteCount">-</div>
      <div class="stat-label">Remote jobs</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="topScore">-</div>
      <div class="stat-label">Highest match</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="updated">-</div>
      <div class="stat-label">Latest discovery</div>
    </div>

  </div>


  <!-- ============================================
       JOBS
       ============================================ -->

  <section>

    <h2>Job Opportunities</h2>

    <div class="controls">

      <input
        id="search"
        type="search"
        placeholder="Search title, company, skills..."
      >

      <select id="remoteFilter">
        <option value="all">All locations</option>
        <option value="remote">Remote only</option>
        <option value="india">India</option>
      </select>

      <select id="sort">
        <option value="score">Highest match</option>
        <option value="newest">Newest</option>
        <option value="title">Title</option>
        <option value="company">Company</option>
      </select>

    </div>

    <div
      id="resultCount"
      class="result-count"
    >
      Loading...
    </div>

    <div
      id="jobs"
      class="loading"
    >
      Loading jobs...
    </div>

  </section>


  <!-- ============================================
       DAILY REPORT
       ============================================ -->

  <section>

    <h2>Daily Career Briefing</h2>

    <div
      id="report"
      class="report"
    >
      Loading report...
    </div>

  </section>


  <footer>
    Personal Career Agent · GitHub Actions · OpenClaw
  </footer>

</main>


<script>

  let allJobs = [];


  // =================================================
  // SECURITY
  // =================================================

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // =================================================
  // CLEAN DESCRIPTION
  // =================================================

  function cleanDescription(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    let text = String(value);

    /*
     * Remove common HTML markup from job feeds.
     */

    text = text
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/p>/gi, "\n")
      .replace(/<[^>]*>/g, " ");

    /*
     * Decode a few common HTML entities.
     */

    text = text
      .replace(/&nbsp;/gi, " ")
      .replace(/&amp;/gi, "&")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&quot;/gi, '"')
      .replace(/&#039;/gi, "'");

    /*
     * Normalize whitespace.
     */

    text = text
      .replace(/\s+/g, " ")
      .trim();

    return text;
  }


  // =================================================
  // SHORT DESCRIPTION
  // =================================================

  function shortDescription(value) {

    const text =
      cleanDescription(value);

    if (!text) {
      return "";
    }

    const maxLength = 320;

    if (text.length <= maxLength) {
      return text;
    }

    return (
      text.substring(0, maxLength)
        .replace(/\s+\S*$/, "") +
      "..."
    );
  }


  // =================================================
  // LOAD JOBS
  // =================================================

  async function loadJobs() {

    const container =
      document.getElementById("jobs");

    try {

      const response = await fetch(
        "./data/jobs.json?" + Date.now()
      );

      if (!response.ok) {
        throw new Error(
          "Unable to load jobs.json"
        );
      }

      const jobs =
        await response.json();

      if (!Array.isArray(jobs)) {
        throw new Error(
          "jobs.json does not contain a list"
        );
      }

      allJobs = jobs;

      updateStats();

      renderJobs();

      updateDate();

    } catch (error) {

      container.innerHTML =
        `<div class="error">
          Could not load jobs.json:
          ${escapeHtml(error.message)}
        </div>`;
    }
  }


  // =================================================
  // UPDATE STATS
  // =================================================

  function updateStats() {

    const jobCount =
      document.getElementById("jobCount");

    const remoteCount =
      document.getElementById("remoteCount");

    const topScore =
      document.getElementById("topScore");


    jobCount.textContent =
      allJobs.length;


    const remoteJobs =
      allJobs.filter(
        job =>
          String(
            job.remote_status || ""
          ).toLowerCase() === "remote"
      );

    remoteCount.textContent =
      remoteJobs.length;


    const scores =
      allJobs
        .map(
          job =>
            Number(
              job.relevance_score || 0
            )
        )
        .filter(
          score =>
            !Number.isNaN(score)
        );


    topScore.textContent =
      scores.length
        ? Math.max(...scores)
        : "0";
  }


  // =================================================
  // FILTER + SORT
  // =================================================

  function getFilteredJobs() {

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const remoteFilter =
      document
        .getElementById("remoteFilter")
        .value;


    const sort =
      document
        .getElementById("sort")
        .value;


    let jobs =
      allJobs.filter(
        job => {

          const searchable =
            [
              job.title,
              job.company,
              job.location,
              job.description
            ]
              .join(" ")
              .toLowerCase();


          if (
            search &&
            !searchable.includes(search)
          ) {
            return false;
          }


          const location =
            String(
              job.location || ""
            ).toLowerCase();


          const remoteStatus =
            String(
              job.remote_status || ""
            ).toLowerCase();


          if (
            remoteFilter === "remote" &&
            remoteStatus !== "remote"
          ) {
            return false;
          }


          if (
            remoteFilter === "india" &&
            !location.includes("india")
          ) {
            return false;
          }


          return true;
        }
      );


    jobs.sort(
      (a, b) => {

        if (sort === "score") {

          return (
            Number(
              b.relevance_score || 0
            ) -
            Number(
              a.relevance_score || 0
            )
          );
        }


        if (sort === "newest") {

          return (
            new Date(
              b.discovered_at || 0
            ) -
            new Date(
              a.discovered_at || 0
            )
          );
        }


        if (sort === "title") {

          return String(
            a.title || ""
          ).localeCompare(
            String(
              b.title || ""
            )
          );
        }


        if (sort === "company") {

          return String(
            a.company || ""
          ).localeCompare(
            String(
              b.company || ""
            )
          );
        }


        return 0;
      }
    );


    return jobs;
  }


  // =================================================
  // RENDER JOBS
  // =================================================

  function renderJobs() {

    const container =
      document.getElementById("jobs");

    const resultCount =
      document.getElementById("resultCount");


    const jobs =
      getFilteredJobs();


    resultCount.textContent =
      `${jobs.length} matching job${
        jobs.length === 1 ? "" : "s"
      }`;


    if (jobs.length === 0) {

      container.innerHTML =
        `<div class="empty">
          No matching jobs found.
        </div>`;

      return;
    }


    container.innerHTML =
      jobs
        .slice(0, 100)
        .map(
          job => {

            const title =
              escapeHtml(
                job.title ||
                "Untitled role"
              );


            const company =
              escapeHtml(
                job.company ||
                "Unknown company"
              );


            const location =
              escapeHtml(
                job.location ||
                "Unknown location"
              );


            const remote =
              escapeHtml(
                job.remote_status ||
                "unknown"
              );


            const source =
              escapeHtml(
                job.source ||
                "unknown"
              );


            const score =
              Number(
                job.relevance_score || 0
              );


            const rawDescription =
              cleanDescription(
                job.description || ""
              );


            const preview =
              escapeHtml(
                shortDescription(
                  rawDescription
                )
              );


            const fullDescription =
              escapeHtml(
                rawDescription
              );


            const url =
              escapeHtml(
                job.url ||
                "#"
              );


            let scoreClass = "";

            if (score < 50) {
              scoreClass = "low";
            } else if (score < 75) {
              scoreClass = "medium";
            }


            return `
              <article class="job">

                <div class="job-header">

                  <div>

                    <div class="job-title">
                      ${title}
                    </div>

                    <div class="company">
                      ${company}
                    </div>

                  </div>

                  <div class="score ${scoreClass}">
                    ${score}/100
                  </div>

                </div>


                <div class="job-meta">

                  <span class="tag">
                    ${location}
                  </span>

                  <span class="tag">
                    ${remote}
                  </span>

                  <span class="tag">
                    ${source}
                  </span>

                </div>


                ${
                  preview
                    ? `
                      <div class="description-preview">
                        ${preview}
                      </div>
                    `
                    : ""
                }


                ${
                  fullDescription
                    ? `
                      <details>

                        <summary>
                          View full description
                        </summary>

                        <div class="full-description">
                          ${fullDescription}
                        </div>

                      </details>
                    `
                    : ""
                }


                <div class="job-actions">

                  <a
                    class="job-link"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Open Job
                  </a>

                </div>

              </article>
            `;
          }
        )
        .join("");
  }


  // =================================================
  // LOAD REPORT
  // =================================================

  async function loadReport() {

    const container =
      document.getElementById("report");


    try {

      const response =
        await fetch(
          "./data/latest_report.md?" +
          Date.now()
        );


      if (!response.ok) {

        throw new Error(
          "Unable to load latest_report.md"
        );
      }


      const report =
        await response.text();


      container.textContent =
        report ||
        "No report available yet.";

    } catch (error) {

      container.innerHTML =
        `<div class="error">
          Could not load latest report:
          ${escapeHtml(error.message)}
        </div>`;
    }
  }


  // =================================================
  // UPDATE DATE
  // =================================================

  function updateDate() {

    const element =
      document.getElementById("updated");


    const dates =
      allJobs
        .map(
          job =>
            new Date(
              job.discovered_at
            )
        )
        .filter(
          date =>
            !Number.isNaN(
              date.getTime()
            )
        );


    if (!dates.length) {

      element.textContent =
        "Unknown";

      return;
    }


    const latest =
      new Date(
        Math.max(
          ...dates.map(
            date =>
              date.getTime()
          )
        )
      );


    element.textContent =
      latest.toLocaleDateString();
  }


  // =================================================
  // CONTROLS
  // =================================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      renderJobs
    );


  document
    .getElementById("remoteFilter")
    .addEventListener(
      "change",
      renderJobs
    );


  document
    .getElementById("sort")
    .addEventListener(
      "change",
      renderJobs
    );


  // =================================================
  // START
  // =================================================

  loadJobs();
  loadReport();

</script>

</body>
</html>
