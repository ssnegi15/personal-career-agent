<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Personal Career Agent</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-light: #1f2937;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --blue: #60a5fa;
      --yellow: #facc15;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 16px;
      margin-bottom: 30px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
    }

    section {
      margin-bottom: 35px;
    }

    .job {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .job-title {
      font-size: 20px;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .company {
      color: var(--muted);
    }

    .score {
      min-width: 65px;
      text-align: center;
      background: #14532d;
      color: #bbf7d0;
      border-radius: 8px;
      padding: 7px 10px;
      font-weight: 700;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .tag {
      background: var(--panel-light);
      border: 1px solid var(--border);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .job-link {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: 600;
    }

    .job-link:hover {
      background: #1d4ed8;
      text-decoration: none;
    }

    .report {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #dbeafe;
      overflow-x: auto;
    }

    .empty {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 25px;
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: #450a0a;
      border: 1px solid #7f1d1d;
      padding: 15px;
      border-radius: 8px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .job-header {
        flex-direction: column;
      }

      .score {
        width: fit-content;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Personal Career Agent</h1>

      <p class="subtitle">
        Autonomous job discovery, analysis and interview preparation
      </p>
    </header>


    <!-- ============================================
         STATS
         ============================================ -->

    <div class="stats">

      <div class="stat">
        <div
          class="stat-number"
          id="jobCount"
        >
          -
        </div>

        <div class="stat-label">
          Jobs discovered
        </div>
      </div>


      <div class="stat">
        <div
          class="stat-number"
          id="remoteCount"
        >
          -
        </div>

        <div class="stat-label">
          Remote jobs
        </div>
      </div>


      <div class="stat">
        <div
          class="stat-number"
          id="topScore"
        >
          -
        </div>

        <div class="stat-label">
          Highest match
        </div>
      </div>


      <div class="stat">
        <div
          class="stat-number"
          id="updated"
        >
          -
        </div>

        <div class="stat-label">
          Last update
        </div>
      </div>

    </div>


    <!-- ============================================
         JOBS
         ============================================ -->

    <section>

      <h2>
        Top Job Opportunities
      </h2>

      <div
        id="jobs"
        class="loading"
      >
        Loading jobs...
      </div>

    </section>


    <!-- ============================================
         REPORT
         ============================================ -->

    <section>

      <h2>
        Daily Career Briefing
      </h2>

      <div
        id="report"
        class="report"
      >
        Loading report...
      </div>

    </section>


    <footer>
      Personal Career Agent · GitHub Actions · OpenClaw
    </footer>

  </main>


  <script>

    // =================================================
    // Utility
    // =================================================

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    // =================================================
    // Load jobs.json
    // =================================================

    async function loadJobs() {

      const container =
        document.getElementById("jobs");

      try {

        const response = await fetch(
          "./data/jobs.json?" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "Unable to load jobs.json"
          );
        }

        const jobs = await response.json();

        if (!Array.isArray(jobs)) {
          throw new Error(
            "jobs.json does not contain a list"
          );
        }

        renderJobs(jobs);

      } catch (error) {

        container.innerHTML =
          `<div class="error">
            Could not load jobs.json:
            ${escapeHtml(error.message)}
          </div>`;

      }
    }


    // =================================================
    // Render jobs
    // =================================================

    function renderJobs(jobs) {

      const container =
        document.getElementById("jobs");

      const jobCount =
        document.getElementById("jobCount");

      const remoteCount =
        document.getElementById("remoteCount");

      const topScore =
        document.getElementById("topScore");

      jobCount.textContent =
        jobs.length;


      const remoteJobs =
        jobs.filter(
          job =>
            String(
              job.remote_status || ""
            ).toLowerCase() === "remote"
        );

      remoteCount.textContent =
        remoteJobs.length;


      const scores =
        jobs
          .map(
            job =>
              Number(
                job.relevance_score || 0
              )
          )
          .filter(
            score => !Number.isNaN(score)
          );


      topScore.textContent =
        scores.length
          ? Math.max(...scores)
          : "0";


      if (jobs.length === 0) {

        container.innerHTML =
          `<div class="empty">
            No jobs have been discovered yet.
          </div>`;

        return;
      }


      container.innerHTML =
        jobs
          .slice(0, 50)
          .map(
            job => {

              const title =
                escapeHtml(
                  job.title || "Untitled role"
                );

              const company =
                escapeHtml(
                  job.company || "Unknown company"
                );

              const location =
                escapeHtml(
                  job.location || "Unknown location"
                );

              const remote =
                escapeHtml(
                  job.remote_status || "unknown"
                );

              const source =
                escapeHtml(
                  job.source || "unknown"
                );

              const score =
                Number(
                  job.relevance_score || 0
                );

              const description =
                escapeHtml(
                  job.description || ""
                );

              const url =
                escapeHtml(
                  job.url || "#"
                );


              return `
                <article class="job">

                  <div class="job-header">

                    <div>

                      <div class="job-title">
                        ${title}
                      </div>

                      <div class="company">
                        ${company}
                      </div>

                    </div>

                    <div class="score">
                      ${score}/100
                    </div>

                  </div>


                  <div class="job-meta">

                    <span class="tag">
                      ${location}
                    </span>

                    <span class="tag">
                      ${remote}
                    </span>

                    <span class="tag">
                      ${source}
                    </span>

                  </div>


                  ${
                    description
                      ? `
                        <div class="description">
                          ${description}
                        </div>
                      `
                      : ""
                  }


                  <a
                    class="job-link"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    View Job
                  </a>

                </article>
              `;
            }
          )
          .join("");
    }


    // =================================================
    // Load latest_report.md
    // =================================================

    async function loadReport() {

      const container =
        document.getElementById("report");

      try {

        const response = await fetch(
          "./data/latest_report.md?" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "Unable to load latest_report.md"
          );
        }

        const report =
          await response.text();

        container.textContent =
          report || "No report available yet.";

      } catch (error) {

        container.innerHTML =
          `<div class="error">
            Could not load latest report:
            ${escapeHtml(error.message)}
          </div>`;
      }
    }


    // =================================================
    // Last update
    // =================================================

    async function loadUpdateTime() {

      const element =
        document.getElementById("updated");

      try {

        const response =
          await fetch(
            "./data/jobs.json?" + Date.now()
          );

        const jobs =
          await response.json();

        if (
          Array.isArray(jobs) &&
          jobs.length > 0
        ) {

          const dates =
            jobs
              .map(
                job =>
                  new Date(
                    job.discovered_at
                  )
              )
              .filter(
                date =>
                  !Number.isNaN(
                    date.getTime()
                  )
              );

          if (dates.length > 0) {

            const latest =
              new Date(
                Math.max(
                  ...dates.map(
                    date =>
                      date.getTime()
                  )
                )
              );

            element.textContent =
              latest.toLocaleDateString();
          }
        }

      } catch (error) {

        element.textContent =
          "Unknown";
      }
    }


    // =================================================
    // Start
    // =================================================

    loadJobs();
    loadReport();
    loadUpdateTime();

  </script>

</body>
</html>
